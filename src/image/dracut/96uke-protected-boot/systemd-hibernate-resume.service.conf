[Unit]
Requires=uke-protected-role.service uke-protected-resume.service
After=uke-protected-role.service uke-protected-resume.service
# Kernel noresume blocks its earlier initcall. The guarded, explicit-device
# native helper can deliberately resume through sysfs after authentication.
ConditionKernelCommandLine=
ConditionPathExists=/run/uke-protected/normal
ConditionPathExists=/run/uke-protected/resume-authorized

[Service]
# Use the original helper with an explicit admitted block mapping and offset.
# Its no-argument mode may discover a different device from cmdline or EFI.
ExecStart=
ExecStart=/usr/lib/systemd/systemd-hibernate-resume /dev/mapper/uke-resume 0
