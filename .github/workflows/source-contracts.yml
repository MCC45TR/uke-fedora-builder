name: Image source contracts
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_test_image:
        description: Assemble a native EXT4 Plasma singleboot test image from signed COPR packages
        type: boolean
        default: false
      test_image_kernel_evr:
        description: Exact cumulative unstable kernel RPM version-release for the test filesystem
        type: string
        default: 7.3.3-28.fc46
      package_test_input_run_id:
        description: Completed successful test-image run to package as the measured B-slot EXT4 test ZIP
        type: string
        default: ''
      build_rescue:
        description: Assemble an unqualified native AArch64 Fedora rescue filesystem
        type: boolean
        default: false
      build_super_seed:
        description: Compose the real Fedora rescue into super and test growth on an owned loop
        type: boolean
        default: false
      build_super_runtime:
        description: Qualify the original Fedora ARM64 super tool closure without boot hooks
        type: boolean
        default: false
      build_rescue_verity:
        description: Qualify a native Fedora EXT4+verity rescue container without installing a boot profile
        type: boolean
        default: false
      verity_super_bytes:
        description: Actual geometry for the candidate; default is measured 512-GB Uke only
        type: string
        default: '11274289152'
      minimum_super_bytes:
        description: Supplied minimum super capacity; default is measured 512-GB Uke only, not 256-GB evidence
        type: string
        default: '11274289152'
      rescue_kernel_evr:
        description: Exact coordinator-qualified cumulative unstable RPM version-release
        type: string
        default: 7.3.3-26.fc46
      rescue_kernel_source:
        description: Exact qualified kernel source commit for the selected RPM cohort
        type: string
        default: c7adc996350e3692b4492ab007cad63070dde6c2
permissions:
  contents: read
  actions: read
concurrency:
  group: image-source-contracts-${{ github.ref }}-${{ inputs.build_test_image && 'test-image' || inputs.package_test_input_run_id != '' && 'package-test' || 'contracts' }}
  cancel-in-progress: false
jobs:
  package-test:
    if: github.event_name == 'workflow_dispatch' && inputs.package_test_input_run_id != ''
    needs: [source, logical-container]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify the selected completed image producer
        id: producer
        env:
          INPUT_RUN: ${{ inputs.package_test_input_run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ $INPUT_RUN =~ ^[1-9][0-9]{0,19}$ && $(uname -m) == aarch64 ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN" > "$RUNNER_TEMP/input-run.json"
          jq -e '.status=="completed" and .conclusion=="success" and .event=="workflow_dispatch" and .path==".github/workflows/source-contracts.yml"' "$RUNNER_TEMP/input-run.json"
          producer=$(jq -er .head_sha "$RUNNER_TEMP/input-run.json")
          [[ $producer =~ ^[a-f0-9]{40}$ ]]
          printf 'commit=%s\n' "$producer" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ext4-plasma-test-input
          path: ${{ runner.temp }}/uke-fastboot-package/input
          run-id: ${{ inputs.package_test_input_run_id }}
          github-token: ${{ github.token }}
      - name: Enable fresh-install staging and package only the measured test destinations
        env:
          INPUT_PRODUCER: ${{ steps.producer.outputs.commit }}
        shell: bash
        run: |
          set -Eeuo pipefail
          image=$(jq -er '.fedora_targets.rawhide.images.aarch64' configs/build-rules.json)
          [[ $image =~ ^registry\.fedoraproject\.org/fedora@sha256:[a-f0-9]{64}$ ]]
          docker build --build-arg "BASE_IMAGE=$image" -f configs/Containerfile.public-unstable -t uke-test-packager configs
          job="$RUNNER_TEMP/uke-fastboot-package"
          docker run --rm --cpus=2 --memory=3g --pids-limit=512 \
            --security-opt apparmor=unconfined \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/builder,readonly" \
            --mount "type=bind,source=$job,target=/job" \
            uke-test-packager bash /builder/src/image/package-ext4-fastboot-test.sh \
              /job/input /builder/configs/images/uke-512gb-test-geometry.json /job/result "$INPUT_PRODUCER"
          sudo chown -R "$(id -u):$(id -g)" "$job/result"
          echo 'Initial EXT4/Plasma installation test: only boot_b and userdata; current slot B and all measured sizes required. Existing native health approval/staging enabled. Secure Boot, encryption, hibernation, rescue and the complete A/B image remain open.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the fastboot-update test ZIP and checksums without a Release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fastboot-update-test
          path: ${{ runner.temp }}/uke-fastboot-package/result
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  test-image:
    if: github.event_name == 'workflow_dispatch' && inputs.build_test_image
    needs: source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Assemble original Fedora Plasma and the matching cumulative kernel
        env:
          IMAGE_EVR: ${{ inputs.test_image_kernel_evr }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ $(uname -m) == aarch64 && $IMAGE_EVR =~ ^7[.]3[.][0-9]+-[1-9][0-9]*[.]fc46$ ]]
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq zstd unzip
          export UKE_CONTAINER_ENGINE=docker
          bash scripts/build-image.sh --mode singleboot --filesystem ext4 --desktop kde \
            --channel unstable --kernel-profile unstable --kernel-rpm "$IMAGE_EVR" \
            --linux-size 8192 --jobs 2 --out "$RUNNER_TEMP/uke-test-image" --yes
          mapfile -t manifests < <(find "$RUNNER_TEMP/uke-test-image" -mindepth 3 -maxdepth 3 -path '*/artifacts/manifest.json')
          [[ ${#manifests[@]} == 1 ]]
          artifacts=${manifests[0]%/manifest.json}
          (cd "$artifacts"; sha256sum --check --strict SHA256SUMS)
          jq -e '.image_built and .filesystem=="ext4" and .partition=="userdata" and .kernel_profile=="unstable"' "${manifests[0]}"
          destination="$RUNNER_TEMP/uke-test-image-result"
          mkdir -m700 "$destination"
          for file in boot.img userdata.img manifest.json; do
            ln "$artifacts/$file" "$destination/$file"
          done
          cp "$artifacts/kernel/kernel-info.json" "$destination/kernel-info.json"
          find "$artifacts" -maxdepth 1 -type f -name '*.json' ! -name manifest.json -exec cp -t "$destination" -- {} +
          (cd "$destination"; sha256sum -- boot.img userdata.img ./*.json > SHA256SUMS)
          echo 'Signed-package EXT4/Plasma input composed and read back. This artifact is not a fastboot-update ZIP or secure-boot, encryption, rescue or hardware acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the test filesystem and exact matching boot input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ext4-plasma-test-input
          path: ${{ runner.temp }}/uke-test-image-result
          if-no-files-found: error
          retention-days: 7
          compression-level: 3
      - name: Retain bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ext4-plasma-test-diagnostics
          path: ${{ runner.temp }}/uke-test-image/image-*/*.log
          if-no-files-found: ignore
          retention-days: 7
  super-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.build_super_runtime
    needs: source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Qualify original native super tools in a nonbootable archive
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ $(uname -m) == aarch64 ]]
          image=$(jq -er '.fedora_targets.rawhide.images.aarch64' configs/build-rules.json)
          [[ $image =~ ^registry\.fedoraproject\.org/fedora@sha256:[a-f0-9]{64}$ ]]
          job="$RUNNER_TEMP/uke-super-runtime-job"
          mkdir -m700 "$job"
          (( $(df -Pm "$job" | awk 'NR==2{print $4}') >= 12288 ))
          cleanup() {
            local status=$?
            trap - EXIT
            sudo find "$job" -depth -delete
            exit "$status"
          }
          trap cleanup EXIT
          docker run --rm --cpus=2 --memory=2g --pids-limit=256 \
            --cap-add=SYS_ADMIN --security-opt apparmor=unconfined \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/builder,readonly" \
            --mount "type=bind,source=$job,target=/job" \
            "$image" bash -Eeuo pipefail -c '
              dnf5 -y --setopt=gpgcheck=True --setopt=install_weak_deps=False install dracut android-tools device-mapper e2fsprogs util-linux jq bash coreutils findutils diffutils binutils cpio gzip
              : > /.uke-super-runtime-worker
              mkdir /run/refuse-native-build
              printf "%s\n" "#!/bin/sh" "echo Native compilation belongs in COPR >&2" "exit 97" > /run/refuse-native-build/refuse
              chmod +x /run/refuse-native-build/refuse
              for tool in cc c++ gcc g++ clang clang++ as ld rpmbuild; do ln -s refuse /run/refuse-native-build/$tool; done
              export PATH=/run/refuse-native-build:$PATH
              bash /builder/src/image/qualify-super-runtime.sh /builder /job/result
            '
          sudo cp -a "$job/result" "$RUNNER_TEMP/uke-super-runtime-result"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/uke-super-runtime-result"
          echo 'Native original-Fedora userspace tool closure passed. No bootable archive, boot hooks, physical UFS, crypto, resume or tablet operation.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain small runtime closure receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unqualified-super-runtime-receipts
          path: ${{ runner.temp }}/uke-super-runtime-result
          if-no-files-found: error
          retention-days: 14
  rescue-root:
    if: github.event_name == 'workflow_dispatch' && (inputs.build_rescue || inputs.build_super_seed || inputs.build_rescue_verity)
    needs: [source, logical-container]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Assemble original Fedora rescue root without compilation
        env:
          RESCUE_EVR: ${{ inputs.rescue_kernel_evr }}
          RESCUE_SOURCE: ${{ inputs.rescue_kernel_source }}
          SUPER_SEED: ${{ inputs.build_super_seed }}
          MINIMUM_SUPER: ${{ inputs.minimum_super_bytes }}
          RESCUE_VERITY: ${{ inputs.build_rescue_verity }}
          VERITY_SUPER: ${{ inputs.verity_super_bytes }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ $(uname -m) == aarch64 && $RESCUE_EVR =~ ^7[.]3[.][0-9]+-[1-9][0-9]*[.]fc46$ && $RESCUE_SOURCE =~ ^[a-f0-9]{40}$ ]]
          [[ $SUPER_SEED == true || $SUPER_SEED == false ]]
          [[ $RESCUE_VERITY == true || $RESCUE_VERITY == false ]]
          [[ $SUPER_SEED != true || $RESCUE_VERITY != true ]]
          [[ $VERITY_SUPER =~ ^[1-9][0-9]{0,12}$ ]]
          [[ $MINIMUM_SUPER =~ ^[1-9][0-9]{0,12}$ ]]
          image=$(jq -er '.fedora_targets.rawhide.images.aarch64' configs/build-rules.json)
          [[ $image =~ ^registry\.fedoraproject\.org/fedora@sha256:[a-f0-9]{64}$ ]]
          job="$RUNNER_TEMP/uke-rescue-job"
          cache="$RUNNER_TEMP/uke-rescue-cache"
          mkdir -m700 "$job" "$cache"
          loop=''
          cleanup() {
            status=$?
            trap - EXIT
            if [[ -n $loop ]]; then
              devno=$(lsblk -dnro MAJ:MIN "$loop")
              for name in uke-rescue uke-super-grow-rescue uke-super-grow-swap uke-super-grow-oldswap uke-super-test-busy; do
                uuid=$(sudo dmsetup info -c --noheadings -o uuid "$name" 2>/dev/null | tr -d '[:space:]') || uuid=''
                case $uuid in
                  "UKE-GROW-v1-${devno/:/-}-rescue"|"UKE-GROW-v1-${devno/:/-}-swap"|"UKE-GROW-v1-${devno/:/-}-oldswap"|"UKE-GROW-TEST-v1-${devno/:/-}"|"UKE-RESCUE-v1-${devno/:/-}")
                    sudo dmsetup --noudevsync remove --retry "$name" || status=1;;
                esac
              done
              sudo losetup -d "$loop" || status=1
            fi
            sudo find "$job" "$cache" -depth -delete
            exit "$status"
          }
          trap cleanup EXIT
          if [[ $SUPER_SEED == true ]]; then
            (( $(df -Pk "$job" | awk 'NR==2{print $4}') >= 24*1024*1024 )) || { echo 'Need 24GiB free for owned seed/provision fixtures and reserve' >&2; exit 1; }
          fi
          if [[ $RESCUE_VERITY == true ]]; then
            (( $(df -Pk "$job" | awk 'NR==2{print $4}') >= 12*1024*1024 ))
          fi
          jq -n --arg evr "$RESCUE_EVR" --arg source "$RESCUE_SOURCE" \
            '{channel:"unstable",fedora_release:"rawhide",kernel_profile:"unstable",kernel_rpm_request:$evr,kernel_commit:$source}' > "$job/request.json"
          docker run --rm --cpus=2 --memory=2g --pids-limit=512 \
            --env "UKE_BUILD_SUPER_SEED=$SUPER_SEED" --env "UKE_MINIMUM_SUPER=$MINIMUM_SUPER" \
            --env "UKE_BUILD_RESCUE_VERITY=$RESCUE_VERITY" --env "UKE_VERITY_SUPER=$VERITY_SUPER" \
            --cap-add=SYS_ADMIN --security-opt apparmor=unconfined \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/builder,readonly" \
            --mount "type=bind,source=$job,target=/job" \
            --mount "type=bind,source=$cache,target=/cache" \
            "$image" bash -Eeuo pipefail -c '
              dnf5 -y --setopt=install_weak_deps=False install jq gnupg2 curl cpio e2fsprogs util-linux coreutils findutils diffutils grep sed gawk binutils systemd systemd-libs libselinux
              : > /.uke-rescue-worker
              mkdir /run/refuse-native-build
              printf "%s\n" "#!/bin/sh" "echo Native compilation belongs in COPR >&2" "exit 97" > /run/refuse-native-build/refuse
              chmod +x /run/refuse-native-build/refuse
              for tool in cc c++ gcc g++ clang clang++ as ld rpmbuild; do ln -s refuse /run/refuse-native-build/$tool; done
              export PATH=/run/refuse-native-build:$PATH
              bash /builder/src/image/compose-fedora-rescue.sh
              if [[ $UKE_BUILD_RESCUE_VERITY == true ]]; then
                dnf5 -y --setopt=install_weak_deps=False install veritysetup
                bash /builder/src/image/qualify-fedora-rescue-verity.sh /job/artifacts/rescue "$UKE_VERITY_SUPER"
              fi
              if [[ $UKE_BUILD_SUPER_SEED == true ]]; then
                dnf5 -y --setopt=install_weak_deps=False install android-tools
                bash /builder/src/image/compose-fastboot-super-seed.sh /job/artifacts/rescue "$UKE_MINIMUM_SUPER" /job/artifacts/super-seed
                bash /builder/tests/fastboot-super-grow.sh prepare-seed /job/artifacts/super-seed /job/super-grow
              fi
            '
          if [[ $SUPER_SEED == true ]]; then
            sudo modprobe -a loop dm_mod
            loop=$(sudo losetup --sector-size 4096 --find --show "$job/super-grow/super.raw")
            [[ $loop =~ ^/dev/loop[0-9]+$ ]]
            dm_major=$(awk '$2=="device-mapper" {print $1}' /proc/devices)
            [[ $dm_major =~ ^[0-9]+$ ]]
            docker run --rm --cpus=2 --memory=2g --pids-limit=256 \
              --cap-add=SYS_ADMIN --security-opt apparmor=unconfined --device="$loop" --device=/dev/mapper/control \
              --device-cgroup-rule="b $dm_major:* rwm" \
              --mount "type=bind,source=$GITHUB_WORKSPACE,target=/builder,readonly" \
              --mount "type=bind,source=$job,target=/job" \
              "$image" bash -Eeuo pipefail -c '
                dnf5 -y --setopt=install_weak_deps=False install android-tools e2fsprogs util-linux device-mapper jq coreutils findutils diffutils
                mkdir /job/artifacts/super-seed/growth
                bash /builder/tests/fastboot-super-grow.sh run "$1" /job/super-grow /job/artifacts/super-seed/growth/real-fedora-growth.json
                bash /builder/tests/fastboot-physical-super.sh "$1" /job/super-grow /job/artifacts/super-seed/growth/real-fedora-growth.json /job/artifacts/super-seed/growth/physical-selection-fixture.json
                cp /job/super-grow/provision-{result,noop}.json /job/artifacts/super-seed/growth/
                cd /job/artifacts/super-seed
                find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > /job/seed-SHA256SUMS
                mv /job/seed-SHA256SUMS SHA256SUMS
              ' bash "$loop"
            sudo losetup -d "$loop"
            loop=''
            sudo cp -a "$job/artifacts/super-seed" "$RUNNER_TEMP/uke-super-seed-result"
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/uke-super-seed-result"
          else
            sudo cp -a "$job/artifacts/rescue" "$RUNNER_TEMP/uke-rescue-result"
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/uke-rescue-result"
          fi
          echo 'Signed original Fedora rescue filesystem assembled; protected boot, authenticated repair and physical UFS acceptance remain open. No release or tablet write.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain rescue input and bounded receipts
        if: ${{ !inputs.build_super_seed && !inputs.build_rescue_verity }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unqualified-fedora-rescue
          path: ${{ runner.temp }}/uke-rescue-result
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Retain original rescue input and verity qualification receipts
        if: inputs.build_rescue_verity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unqualified-fedora-rescue-verity
          path: ${{ runner.temp }}/uke-rescue-result
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Retain actual super seed and growth receipts
        if: inputs.build_super_seed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unqualified-fastboot-super-seed
          path: ${{ runner.temp }}/uke-super-seed-result
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install source inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck jq ripgrep make zstd zip unzip e2fsprogs
      - name: Validate source without compilation or RPM generation
        shell: bash
        run: |
          set -Eeuo pipefail
          guard=$(mktemp -d)
          trap 'rm -rf -- "$guard"' EXIT
          cat > "$guard/refuse-build" <<'GUARD'
          #!/bin/sh
          echo "Native compilation and RPM generation belong in COPR: ${0##*/}" >&2
          exit 97
          GUARD
          chmod +x "$guard/refuse-build"
          for tool in gcc g++ cc c++ clang clang++ as ld rpmbuild; do ln -s refuse-build "$guard/$tool"; done
          export PATH="$guard:$PATH"
          shellcheck src/image/fastboot-singleboot-layout.sh src/image/plan-fastboot-update.sh src/image/build-fastboot-super.sh scripts/check-fastboot-super-layout.sh scripts/probe-inlinecrypt-readonly.sh scripts/probe-ext4-reencrypt-scratch.sh tests/fastboot-singleboot-layout.sh tests/fastboot-super-composition.sh
          shellcheck src/image/inspect-fastboot-super.sh src/image/map-fastboot-rescue.sh tests/fastboot-super-inspection.sh tests/fastboot-rescue-map.sh
          shellcheck src/image/plan-super-provision.sh src/image/provision-fastboot-super.sh tests/fastboot-super-provision-plan.sh tests/fastboot-super-grow.sh
          shellcheck src/image/fastboot-requirements.sh tests/fastboot-tcp-peer.sh tests/fastboot-update-parser.sh
          shellcheck src/image/test-fastboot-profile.sh src/image/package-ext4-fastboot-test.sh scripts/install-fastboot-test.sh
          shellcheck src/image/configure-fedora-rescue.sh src/image/compose-fedora-rescue.sh
          shellcheck src/image/compose-fastboot-super-seed.sh
          shellcheck src/image/dracut/95uke-super-tools/module-setup.sh src/image/qualify-super-runtime.sh tests/fastboot-super-runtime.sh
          shellcheck src/image/select-uke-super.sh tests/fastboot-physical-super.sh
          shellcheck src/image/dracut/96uke-protected-boot/module-setup.sh tests/protected-initrd-barriers.sh
          shellcheck src/image/rescue-verity-layout.sh src/image/build-rescue-verity.sh src/image/qualify-fedora-rescue-verity.sh tests/rescue-verity.sh
          shellcheck tests/rescue-verity-map.sh
          bash tests/fastboot-singleboot-layout.sh
          for script in src/public/*.sh packaging/*.sh; do bash -n "$script"; done
          shellcheck --exclude=SC2015 src/public/*.sh packaging/*.sh tests/public-build-contract.sh tests/public-channel-contract.sh
          bash tests/public-build-contract.sh
          shellcheck tests/distribution-routing.sh
          bash tests/distribution-routing.sh
          shellcheck src/ubuntu/configure-root.sh tests/ubuntu-root-contract.sh
          bash tests/ubuntu-root-contract.sh
          bash tests/public-channel-contract.sh
          shellcheck src/public/languages.sh tests/languages.sh
          bash tests/languages.sh
          shellcheck tests/language-repair.sh
          bash tests/language-repair.sh
          shellcheck tests/serialized-languages.sh
          bash tests/serialized-languages.sh
          shellcheck src/public/first-boot-policy.sh tests/first-boot-policy.sh tests/clock-epoch.sh
          bash tests/first-boot-policy.sh
          bash tests/clock-epoch.sh
          bash tests/repository-kernel-plan.sh
          shellcheck src/public/cohort.sh tests/repository-kernel-identity.sh
          bash tests/repository-kernel-identity.sh
          shellcheck tests/public-root-packages.sh tests/public-copr-root-contract.sh
          bash tests/public-root-packages.sh
          bash tests/public-copr-root-contract.sh
          bash tests/public-worker-snapshot.sh docker
          shellcheck --exclude=SC2015 src/audit/check-target-payload.sh tests/payload-traversal.sh
          bash tests/payload-traversal.sh
          shellcheck src/public/cutefish-icons-proof.sh tests/cutefish-passive-icons.sh
          bash tests/cutefish-passive-icons.sh
          bash tests/original-kde-payload.sh
          shellcheck src/public/release-layout.sh scripts/publish-image-release.sh scripts/merge-desktop-deliveries.sh scripts/reuse-validated-desktop.sh tests/release-layout.sh
          bash tests/release-layout.sh
          shellcheck src/public/shared-core.sh src/public/desktop-repository.sh src/public/desktop-setup.sh src/public/nextkde-session.sh scripts/hosted-core.sh scripts/hosted-image.sh tests/shared-core.sh
          bash tests/shared-core.sh
          shellcheck src/public/root-kernel-signatures.sh tests/root-kernel-signatures.sh
          bash tests/root-kernel-signatures.sh
          shellcheck scripts/reuse-verified-core.sh tests/reuse-core.sh
          bash tests/reuse-core.sh
          shellcheck src/public/desktop-isolation.sh tests/desktop-isolation.sh
          bash tests/desktop-isolation.sh
          echo 'Native helper builds and file fixtures run in the uke-image-tools COPR build.' >> "$GITHUB_STEP_SUMMARY"
  logical-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compose and independently decode a synthetic super container
        shell: bash
        run: |
          set -Eeuo pipefail
          image=$(jq -er '.fedora_targets.rawhide.images.x86_64' configs/build-rules.json)
          [[ $image =~ ^registry\.fedoraproject\.org/fedora@sha256:[0-9a-f]{64}$ ]]
          fixture="$RUNNER_TEMP/uke-super-check"
          mkdir -m700 "$fixture"
          loop=''
          cleanup() {
            status=$?
            trap - EXIT
            if [[ -n $loop ]]; then
              devno=$(lsblk -dnro MAJ:MIN "$loop")
              for name in uke-verity-fixture-root uke-verity-fixture-data uke-rescue uke-rescue-test-payload uke-super-grow-rescue uke-super-grow-swap uke-super-grow-oldswap uke-super-test-busy; do
                uuid=$(sudo dmsetup info -c --noheadings -o uuid "$name" 2>/dev/null | tr -d '[:space:]') || uuid=''
                case $uuid in
                  "UKE-RESCUE-v1-${devno/:/-}"|"UKE-FIXTURE-RESCUE-occupied-${devno/:/-}"|"UKE-FIXTURE-RESCUE-payload-${devno/:/-}")
                    sudo dmsetup --noudevsync remove --retry "$name" || status=1;;
                  "UKE-GROW-v1-${devno/:/-}-rescue"|"UKE-GROW-v1-${devno/:/-}-swap"|"UKE-GROW-v1-${devno/:/-}-oldswap"|"UKE-GROW-TEST-v1-${devno/:/-}")
                    sudo dmsetup --noudevsync remove --retry "$name" || status=1;;
                  "UKE-VERITY-FIXTURE-v1-${devno/:/-}-root"|"UKE-VERITY-FIXTURE-v1-${devno/:/-}-data")
                    sudo dmsetup --noudevsync remove --retry "$name" || status=1;;
                esac
              done
              sudo losetup -d "$loop" || status=1
            fi
            sudo find "$fixture" -depth -delete
            exit "$status"
          }
          trap cleanup EXIT
          docker run --rm --cpus=2 --memory=2g --pids-limit=256 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            --mount "type=bind,source=$fixture,target=/fixture" \
            "$image" bash -Eeuo pipefail -c '
              dnf -y --setopt=install_weak_deps=False install android-tools e2fsprogs util-linux jq coreutils findutils diffutils socat zip git-core strace systemd systemd-udev veritysetup
              mkdir -m700 /fixture/result
              rpm -q android-tools e2fsprogs util-linux jq coreutils systemd systemd-udev > /fixture/result/original-tools.txt
              bash /source/tests/protected-initrd-barriers.sh /fixture/result/protected-initrd-barriers.json
              bash /source/tests/rescue-verity.sh /fixture/result/rescue-verity.json
              bash /source/tests/rescue-verity-map.sh prepare /fixture/verity-map
              bash /source/tests/fastboot-update-parser.sh /fixture/result/fastboot-parser.json
              bash /source/tests/fastboot-super-inspection.sh
              bash /source/tests/fastboot-super-provision-plan.sh
              # Bound syscall evidence for the intermittent host lpdump timeout.
              # No alternate parser, retry or raised production resource limit.
              mkdir /fixture/trace-bin
              printf "%s\n" "#!/bin/sh" "exec /usr/bin/strace -qq -T -s80 -e trace=openat,flock,lseek,read,pread64 -o /fixture/lpdump-last.trace /usr/bin/lpdump \"\$@\"" > /fixture/trace-bin/lpdump
              chmod +x /fixture/trace-bin/lpdump
              export PATH=/fixture/trace-bin:$PATH
              trap '\''status=$?; if ((status)); then tail -n24 /fixture/lpdump-last.trace >&2; cat /sys/fs/cgroup/memory.events /sys/fs/cgroup/cpu.stat >&2; fi; exit "$status"'\'' EXIT
              bash /source/tests/fastboot-super-composition.sh /fixture/reports
              cp /fixture/reports/* /fixture/result/
              bash /source/tests/fastboot-rescue-map.sh prepare /fixture/rescue-map
              bash /source/tests/fastboot-super-grow.sh prepare /fixture/super-grow
              sha256sum /source/src/image/{build-fastboot-super,inspect-fastboot-super,map-fastboot-rescue,fastboot-singleboot-layout,plan-super-provision,provision-fastboot-super,fastboot-requirements,plan-fastboot-update,select-uke-super}.sh /source/tests/fastboot-{super-composition,super-inspection,rescue-map,super-provision-plan,super-grow,update-parser,tcp-peer,physical-super}.sh > /fixture/result/source-sha256.txt
              sha256sum /source/src/image/dracut/96uke-protected-boot/* /source/tests/protected-initrd-barriers.sh >> /fixture/result/source-sha256.txt
              sha256sum /source/src/image/rescue-verity-layout.sh /source/src/image/build-rescue-verity.sh /source/src/image/qualify-fedora-rescue-verity.sh /source/tests/rescue-verity.sh >> /fixture/result/source-sha256.txt
              sha256sum /source/tests/rescue-verity-map.sh >> /fixture/result/source-sha256.txt
            '
          # The host lends only this owned loop device and the DM control node.
          # No tablet, physical disk, host root mount or privileged container.
          sudo modprobe -a loop dm_mod dm_verity
          sudo dmsetup version
          loop=$(sudo losetup --find --show "$fixture/rescue-map/super.raw")
          [[ $loop =~ ^/dev/loop[0-9]+$ ]]
          dm_major=$(awk '$2=="device-mapper" {print $1}' /proc/devices)
          [[ $dm_major =~ ^[0-9]+$ ]]
          docker run --rm --cpus=2 --memory=2g --pids-limit=256 \
            --cap-add=SYS_ADMIN --device="$loop" --device=/dev/mapper/control \
            --device-cgroup-rule="b $dm_major:* rwm" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            --mount "type=bind,source=$fixture,target=/fixture" \
            "$image" bash -Eeuo pipefail -c '
              dnf -y --setopt=install_weak_deps=False install android-tools e2fsprogs util-linux device-mapper jq coreutils findutils diffutils
              rpm -q device-mapper > /fixture/result/mapper-tool.txt
              bash /source/tests/fastboot-rescue-map.sh run "$1" /fixture/rescue-map /fixture/result/rescue-mapper-fixture.json
              cp /fixture/rescue-map/mapping-result.json /fixture/result/
            ' bash "$loop"
          sudo losetup -d "$loop"
          loop=''
          loop=$(sudo losetup --sector-size 4096 --find --show "$fixture/super-grow/super.raw")
          [[ $loop =~ ^/dev/loop[0-9]+$ ]]
          docker run --rm --cpus=2 --memory=2g --pids-limit=256 \
            --cap-add=SYS_ADMIN --security-opt apparmor=unconfined --device="$loop" --device=/dev/mapper/control \
            --device-cgroup-rule="b $dm_major:* rwm" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            --mount "type=bind,source=$fixture,target=/fixture" \
            "$image" bash -Eeuo pipefail -c '
              dnf -y --setopt=install_weak_deps=False install android-tools e2fsprogs util-linux device-mapper jq coreutils findutils diffutils
              bash /source/tests/fastboot-super-grow.sh run "$1" /fixture/super-grow /fixture/result/super-grow-fixture.json
              bash /source/tests/fastboot-physical-super.sh "$1" /fixture/super-grow /fixture/result/super-grow-fixture.json /fixture/result/physical-selection-fixture.json
              cp /fixture/super-grow/provision-{result,noop}.json /fixture/result/
            ' bash "$loop"
          sudo losetup -d "$loop"
          loop=''
          loop=$(sudo losetup --sector-size 4096 --find --show "$fixture/verity-map/carrier.raw")
          [[ $loop =~ ^/dev/loop[0-9]+$ ]]
          docker run --rm --cpus=2 --memory=2g --pids-limit=256 \
            --cap-add=SYS_ADMIN --security-opt apparmor=unconfined --device="$loop" --device=/dev/mapper/control \
            --device-cgroup-rule="b $dm_major:* rwm" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            --mount "type=bind,source=$fixture,target=/fixture" \
            "$image" bash -Eeuo pipefail -c '
              dnf -y --setopt=install_weak_deps=False install e2fsprogs util-linux device-mapper jq coreutils findutils diffutils
              bash /source/tests/rescue-verity-map.sh run "$1" /fixture/verity-map /fixture/result/rescue-verity-kernel.json
            ' bash "$loop"
          sudo cp -a "$fixture/result" "$RUNNER_TEMP/uke-super-reports"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/uke-super-reports"
          echo 'Synthetic liblp composition, real read-only rescue mapping and seed-to-larger-device provisioning/restart tests passed. No physical UFS, OS boot, real power-loss, secure boot or encryption acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain small validation receipts only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: logical-container-receipts
          path: ${{ runner.temp }}/uke-super-reports
          if-no-files-found: error
          retention-days: 14
