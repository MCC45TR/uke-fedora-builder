name: Image source contracts
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stable_fastboot_kernel_evr:
        description: Exact published normal Stable kernel RPM version-release for the KDE fastboot ZIP
        type: string
        default: ''
      stable_super_rescue:
        description: Assemble the matching Stable super seed and live rescue from signed inputs
        type: boolean
        default: false
      stable_super_components_run:
        description: Successful Stable rescue components run for assembling the singleboot ZIP
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: image-source-contracts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stable-super-fastboot:
    if: >-
      always() && github.event_name == 'workflow_dispatch' && needs.source.result == 'success' &&
      (inputs.stable_super_components_run != '' || needs.stable-super-rescue.result == 'success')
    needs: [source, stable-super-rescue]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify the source runs
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENTS_RUN: ${{ inputs.stable_super_components_run || github.run_id }}
        run: |
          set -Eeuo pipefail
          [[ $COMPONENTS_RUN =~ ^[1-9][0-9]{0,13}$ ]]
          api="repos/$GITHUB_REPOSITORY/actions/runs"
          gh api "$api/44546857648" | jq -e '
            .conclusion=="success" and .head_sha=="bc158a877d92d050fd3d7d6a08247df8e112b253"'
          if [[ $COMPONENTS_RUN != "$GITHUB_RUN_ID" ]]; then
            gh api "$api/$COMPONENTS_RUN" | jq -e '
              .conclusion=="success" and .event=="workflow_dispatch" and
              .path==".github/workflows/source-contracts.yml" and .head_branch=="release/stable-fastboot-7.4.5"'
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq zip unzip e2fsprogs android-sdk-libsparse-utils
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 44546857648
          name: uke-stable-kde-bash-singleboot-fastboot
          path: ${{ runner.temp }}/uke-stable-desktop
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.stable_super_components_run || github.run_id }}
          name: uke-stable-super-components
          path: ${{ runner.temp }}/uke-stable-super-components
      - name: Assemble the Stable singleboot fastboot ZIP
        env:
          COMPONENTS_RUN: ${{ inputs.stable_super_components_run || github.run_id }}
        run: |
          set -Eeuo pipefail
          (( $(df -Pk "$RUNNER_TEMP" | awk 'NR==2{print $4}') >= 16*1024*1024 ))
          bash src/image/package-stable-super-fastboot.sh "$RUNNER_TEMP/uke-stable-desktop" \
            "$RUNNER_TEMP/uke-stable-super-components" "$RUNNER_TEMP/uke-stable-super-fastboot"
          (cd "$RUNNER_TEMP/uke-stable-super-fastboot"; sha256sum -c --strict SHA256SUMS)
          echo "Stable KDE Plasma and Bash singleboot ZIP with DTBO, super, linux_swap and Fedora live rescue. Source runs 44546857648 and $COMPONENTS_RUN." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uke-stable-kde-bash-singleboot-super-fastboot
          path: ${{ runner.temp }}/uke-stable-super-fastboot
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  stable-super-rescue:
    if: github.event_name == 'workflow_dispatch' && inputs.stable_super_rescue
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compose the signed Stable boot profiles and live rescue seed
        env:
          IMAGE_EVR: ${{ inputs.stable_fastboot_kernel_evr }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ $(uname -m) == aarch64 && $IMAGE_EVR == 7.3.5-13.fc46 ]]
          image=$(jq -er '.fedora_targets.rawhide.images.aarch64' configs/build-rules.json)
          [[ $image =~ ^registry[.]fedoraproject[.]org/fedora@sha256:[a-f0-9]{64}$ ]]
          job="$RUNNER_TEMP/uke-rescue-job"
          cache="$RUNNER_TEMP/uke-rescue-cache"
          mkdir -m700 "$job" "$cache"
          (( $(df -Pk "$job" | awk 'NR==2{print $4}') >= 24*1024*1024 ))
          jq -n --arg evr "$IMAGE_EVR" --arg source 717f7d6c8fd26d3c066f936101b8c2011391cbf2 '
            {channel:"stable",fedora_release:"rawhide",kernel_profile:"normal",kernel_rpm_request:$evr,expected_kernel_source:$source}
          ' > "$job/request.json"
          docker run --rm --cpus=2 --memory=3g --pids-limit=512 \
            --cap-add=SYS_ADMIN --security-opt apparmor=unconfined \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/builder,readonly" \
            --mount "type=bind,source=$job,target=/job" \
            --mount "type=bind,source=$cache,target=/cache" \
            "$image" bash -Eeuo pipefail -c '
              dnf5 -y --setopt=install_weak_deps=False install jq gnupg2 curl cpio e2fsprogs util-linux coreutils findutils diffutils grep sed gawk binutils systemd systemd-libs libselinux libstdc++ kmod android-tools dnf5-plugins
              : > /.uke-rescue-worker
              bash /builder/src/image/compose-fedora-rescue.sh
              bash /builder/src/image/compose-fastboot-super-seed.sh /job/artifacts/rescue 4294967296 /job/artifacts/super-seed
              (cd /job/artifacts/super-seed; sha256sum -c --strict SHA256SUMS)
              (cd /job/artifacts/super-boots; sha256sum boot.img rescue-boot.img super-profiles.json > SHA256SUMS)
            '
          owner="$(id -u):$(id -g)"
          sudo chown "$owner" "$job/artifacts"
          sudo chown -R "$owner" "$job/artifacts/super-boots" "$job/artifacts/super-seed"
          printf 'Signed Stable boot wrapper reproduction, FEDORA_RESCUE readback and the linux_swap/super seed verified.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uke-stable-super-components
          path: |
            ${{ runner.temp }}/uke-rescue-job/artifacts/super-boots
            ${{ runner.temp }}/uke-rescue-job/artifacts/super-seed
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
  stable-fastboot:
    if: github.event_name == 'workflow_dispatch' && inputs.stable_fastboot_kernel_evr != '' && !inputs.stable_super_rescue
    needs: source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Assemble and verify the Stable fastboot ZIP
        env:
          IMAGE_EVR: ${{ inputs.stable_fastboot_kernel_evr }}
          UKE_CONTAINER_ENGINE: docker
          UKE_FASTBOOT_OUTPUT: '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ $(uname -m) == aarch64 && $IMAGE_EVR =~ ^7[.]3[.]5-[1-9][0-9]*[.]fc46$ ]]
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq zstd
          bash scripts/build-image.sh --release rawhide --mode singleboot --filesystem ext4 \
            --desktop kde --shell bash --channel stable --kernel-profile normal --kernel-rpm "$IMAGE_EVR" \
            --linux-size 8192 --jobs 2 --out "$RUNNER_TEMP/uke-stable-fastboot-build" --yes
          mapfile -t manifests < <(find "$RUNNER_TEMP/uke-stable-fastboot-build" -mindepth 3 -maxdepth 3 -path '*/fastboot/manifest.json')
          [[ ${#manifests[@]} == 1 ]]
          output=${manifests[0]%/manifest.json}
          (cd "$output"; sha256sum -c --strict SHA256SUMS)
          mv "$output" "$RUNNER_TEMP/uke-stable-fastboot"
          printf 'Stable KDE Plasma and Bash singleboot installation test for the measured 512 GB Uke. Includes DTBO, boot and userdata. The archive replaces userdata.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uke-stable-kde-bash-singleboot-fastboot
          path: ${{ runner.temp }}/uke-stable-fastboot
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: stable-fastboot-diagnostics
          path: ${{ runner.temp }}/uke-stable-fastboot-build/image-*/*.log
          if-no-files-found: ignore
          retention-days: 7
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install source inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck jq ripgrep make zstd zip unzip e2fsprogs
      - name: Validate source without compilation or RPM generation
        shell: bash
        run: |
          set -Eeuo pipefail
          guard=$(mktemp -d)
          trap 'rm -rf -- "$guard"' EXIT
          cat > "$guard/refuse-build" <<'GUARD'
          #!/bin/sh
          echo "Native compilation and RPM generation belong in COPR: ${0##*/}" >&2
          exit 97
          GUARD
          chmod +x "$guard/refuse-build"
          for tool in gcc g++ cc c++ clang clang++ as ld rpmbuild; do ln -s refuse-build "$guard/$tool"; done
          export PATH="$guard:$PATH"
          for script in src/public/*.sh packaging/*.sh; do bash -n "$script"; done
          shellcheck --exclude=SC2015 src/public/*.sh packaging/*.sh tests/public-build-contract.sh tests/public-channel-contract.sh
          bash tests/public-build-contract.sh
          shellcheck tests/distribution-routing.sh
          bash tests/distribution-routing.sh
          shellcheck src/ubuntu/configure-root.sh tests/ubuntu-root-contract.sh
          bash tests/ubuntu-root-contract.sh
          bash tests/public-channel-contract.sh
          shellcheck src/public/languages.sh tests/languages.sh
          bash tests/languages.sh
          shellcheck tests/language-repair.sh
          bash tests/language-repair.sh
          shellcheck tests/serialized-languages.sh
          bash tests/serialized-languages.sh
          shellcheck src/public/first-boot-policy.sh tests/first-boot-policy.sh tests/clock-epoch.sh
          bash tests/first-boot-policy.sh
          bash tests/clock-epoch.sh
          bash tests/repository-kernel-plan.sh
          shellcheck src/public/cohort.sh tests/repository-kernel-identity.sh
          shellcheck src/image/fastboot-requirements.sh src/image/package-stable-fastboot-test.sh
          shellcheck scripts/install-stable-super-fastboot.sh src/image/package-stable-super-fastboot.sh
          bash tests/stable-super-fastboot-installer.sh
          bash tests/repository-kernel-identity.sh
          bash tests/public-worker-snapshot.sh docker
          shellcheck --exclude=SC2015 src/audit/check-target-payload.sh tests/payload-traversal.sh
          bash tests/payload-traversal.sh
          shellcheck src/public/cutefish-icons-proof.sh tests/cutefish-passive-icons.sh
          bash tests/cutefish-passive-icons.sh
          bash tests/original-kde-payload.sh
          shellcheck src/public/release-layout.sh scripts/publish-image-release.sh scripts/merge-desktop-deliveries.sh scripts/reuse-validated-desktop.sh tests/release-layout.sh
          bash tests/release-layout.sh
          shellcheck src/public/shared-core.sh src/public/desktop-repository.sh src/public/desktop-setup.sh src/public/nextkde-session.sh scripts/hosted-core.sh scripts/hosted-image.sh tests/shared-core.sh
          bash tests/shared-core.sh
          shellcheck src/public/root-kernel-signatures.sh tests/root-kernel-signatures.sh
          bash tests/root-kernel-signatures.sh
          shellcheck scripts/reuse-verified-core.sh tests/reuse-core.sh
          bash tests/reuse-core.sh
          shellcheck src/public/desktop-isolation.sh tests/desktop-isolation.sh
          bash tests/desktop-isolation.sh
          echo 'Native helper builds and file fixtures run in the uke-image-tools COPR build.' >> "$GITHUB_STEP_SUMMARY"
