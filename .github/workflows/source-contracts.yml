name: Image source contracts
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stable_fastboot_kernel_evr:
        description: Exact published normal Stable kernel RPM version-release for the KDE fastboot ZIP
        type: string
        default: ''
      stable_super_rescue:
        description: Assemble the matching Stable super seed and live rescue from signed inputs
        type: boolean
        default: false
      pad7_kernel_evr:
        description: Signed normal COPR kernel RPM version-release containing the Pad 7 ramoops fix
        type: string
        default: ''
      pad7_kernel_release:
        description: Exact uname -r of the Pad 7 test kernel
        type: string
        default: ''
      pad7_kernel_source:
        description: Upstream source commit recorded in the signed Pad 7 kernel cohort
        type: string
        default: ''
      pad7_temporary_boot:
        description: Rewrap the verified 7.4.11 Pad 7 image for a temporary fastboot boot test
        type: boolean
        default: false
      pad7_unstable_boot_build:
        description: Successful Unstable COPR build ID for a temporary Pad 7 boot image
        type: string
        default: ''
      stable_super_components_run:
        description: Successful Stable rescue components run for assembling the singleboot ZIP
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: image-source-contracts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pad7-temporary-boot:
    if: github.event_name == 'workflow_dispatch' && (inputs.pad7_temporary_boot || inputs.pad7_unstable_boot_build != '')
    runs-on: ${{ inputs.pad7_unstable_boot_build != '' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify the signed-kernel source workflow
        if: inputs.pad7_unstable_boot_build == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44701861114" | jq -e '
            .conclusion=="success" and .head_sha=="e3b35feba3ee8be90d65f3a882025e5feabae10c"'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14613925842" | jq -e '
            (.expired|not) and .workflow_run.id==44701861114 and
            .digest=="sha256:6125f281e0dec916c70c8c3aa49d1ceac8c14b0e28e341fb864bd2fc5bf7354b"'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.pad7_unstable_boot_build == ''
        with:
          github-token: ${{ github.token }}
          run-id: 44701861114
          name: uke-stable-super-components
          path: ${{ runner.temp }}/pad7-boot-source
      - name: Rewrap and verify the temporary boot image
        env:
          COPR_BUILD_ID: ${{ inputs.pad7_unstable_boot_build }}
        run: |
          set -Eeuo pipefail
          image=$(jq -er --arg arch "$(uname -m)" '.fedora_targets.rawhide.images[$arch]' configs/build-rules.json)
          [[ $image =~ ^registry[.]fedoraproject[.]org/fedora@sha256:[a-f0-9]{64}$ ]]
          output="$RUNNER_TEMP/pad7-temporary-boot"
          mkdir -p "$output" "$RUNNER_TEMP/pad7-boot-source"
          docker run --rm --cpus=2 --memory=2g --env COPR_BUILD_ID \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/builder,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/pad7-boot-source,target=/inputs,readonly" \
            --mount "type=bind,source=$output,target=/output" \
            "$image" bash -Eeuo pipefail -c '
              dnf5 -y --setopt=install_weak_deps=False install android-tools diffutils findutils grep jq socat
              if [[ -n $COPR_BUILD_ID ]]; then
                dnf5 -y --setopt=install_weak_deps=False install cpio curl gnupg2 rpm
                bash /builder/src/image/compose-pad7-unstable-boot.sh "$COPR_BUILD_ID" /output
              else
                bash /builder/src/image/compose-pad7-temporary-boot.sh /inputs/super-boots/boot.img /output/boot.img
                printf "%s\n" 7.4.11-senemos > /output/kernel-release
              fi
              bash /builder/tests/temporary-fastboot-boot.sh /output/boot.img
            '
          sha256sum "$output/boot.img" | awk '{print $1}' > "$RUNNER_TEMP/pad7-boot-sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: boot
        with:
          path: ${{ runner.temp }}/pad7-temporary-boot/boot.img
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Verify the downloadable image
        env:
          DIGEST: ${{ steps.boot.outputs.artifact-digest }}
        run: |
          expected=$(< "$RUNNER_TEMP/pad7-boot-sha256")
          [[ $expected =~ ^[0-9a-f]{64}$ && $DIGEST == "$expected" ]]
          release=$(< "$RUNNER_TEMP/pad7-temporary-boot/kernel-release")
          [[ $release =~ ^(7[.]4[.]11-senemos|7[.]3[.]5-[1-9][0-9]*)$ ]]
          printf 'Temporary `fastboot boot boot.img` test for kernel `%s`. Full Fedora functionality needs matching modules. SHA-256 `%s`.\n' "$release" "$expected" >> "$GITHUB_STEP_SUMMARY"
  stable-super-fastboot:
    if: >-
      always() && github.event_name == 'workflow_dispatch' && needs.source.result == 'success' &&
      ((inputs.pad7_kernel_evr == '' && (inputs.stable_super_components_run != '' || needs.stable-super-rescue.result == 'success')) ||
       (inputs.pad7_kernel_evr != '' && needs.pad7-desktop.result == 'success' && needs.stable-super-rescue.result == 'success'))
    needs: [source, stable-super-rescue, pad7-desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify the source runs
        if: inputs.pad7_kernel_evr == ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENTS_RUN: ${{ inputs.stable_super_components_run || github.run_id }}
        run: |
          set -Eeuo pipefail
          [[ $COMPONENTS_RUN =~ ^[1-9][0-9]{0,13}$ ]]
          api="repos/$GITHUB_REPOSITORY/actions/runs"
          gh api "$api/44546857648" | jq -e '
            .conclusion=="success" and .head_sha=="bc158a877d92d050fd3d7d6a08247df8e112b253"'
          if [[ $COMPONENTS_RUN != "$GITHUB_RUN_ID" ]]; then
            gh api "$api/$COMPONENTS_RUN" | jq -e '
              .conclusion=="success" and .event=="workflow_dispatch" and
              .path==".github/workflows/source-contracts.yml" and .head_branch=="release/stable-fastboot-7.4.5"'
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.pad7_kernel_evr == ''
        with:
          github-token: ${{ github.token }}
          run-id: 44546857648
          name: uke-stable-kde-bash-singleboot-fastboot
          path: ${{ runner.temp }}/uke-stable-desktop
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.pad7_kernel_evr != ''
        with:
          name: uke-pad7-desktop
          path: ${{ runner.temp }}/uke-stable-desktop
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.pad7_kernel_evr != '' && github.run_id || inputs.stable_super_components_run || github.run_id }}
          name: uke-stable-super-components
          path: ${{ runner.temp }}/uke-stable-super-components
      - name: Assemble the singleboot fastboot ZIP
        env:
          PAD7_RELEASE: ${{ inputs.pad7_kernel_release }}
          PAD7_EVR: ${{ inputs.pad7_kernel_evr }}
          PAD7_SOURCE: ${{ inputs.pad7_kernel_source }}
          COMPONENTS_RUN: ${{ inputs.stable_super_components_run || github.run_id }}
        run: |
          set -Eeuo pipefail
          (( $(df -Pk "$RUNNER_TEMP" | awk 'NR==2{print $4}') >= 16*1024*1024 ))
          image=$(jq -er '.fedora_targets.rawhide.images.x86_64' configs/build-rules.json)
          [[ $image =~ ^registry[.]fedoraproject[.]org/fedora@sha256:[a-f0-9]{64}$ ]]
          export_dir="$RUNNER_TEMP/uke-stable-fastboot-export"
          mkdir "$export_dir"
          package_args=()
          if [[ -n $PAD7_EVR ]]; then
            package_args=("$PAD7_RELEASE" "$PAD7_EVR" "$PAD7_SOURCE")
          fi
          docker run --rm --cpus=2 --memory=3g --env GITHUB_SHA \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/builder,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/uke-stable-desktop,target=/desktop,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/uke-stable-super-components,target=/components,readonly" \
            --mount "type=bind,source=$export_dir,target=/export" \
            "$image" bash -Eeuo pipefail -c '
              dnf5 -y --setopt=install_weak_deps=False install android-tools e2fsprogs jq zip unzip socat diffutils findutils grep
              bash /builder/src/image/package-stable-super-fastboot.sh /desktop /components /export/final "$@"
              cd /export/final
              sha256sum -c --strict SHA256SUMS
              archive=(fedora-*-fastboot.zip)
              [[ ${#archive[@]} == 1 && -f ${archive[0]} ]]
              unzip -p "${archive[0]}" super_empty.img > /export/super_empty.img
              fastboot --version
              bash /builder/tests/stable-super-fastboot-update.sh /export/super_empty.img
            ' bash "${package_args[@]}"
          sudo chown -R "$(id -u):$(id -g)" "$export_dir/final"
          mv "$export_dir/final" "$RUNNER_TEMP/uke-stable-super-fastboot"
          printf 'Install on stock Uke with `fastboot update ./fedora-*-fastboot.zip`.\n' >> "$GITHUB_STEP_SUMMARY"
          if [[ -n $PAD7_EVR ]]; then
            printf 'Pad 7 ramoops fallback verified in signed normal kernel `%s` (COPR RPM `%s`).\n' "$PAD7_RELEASE" "$PAD7_EVR" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Signed source runs 44546857648 and %s.\n' "$COMPONENTS_RUN" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: download
        with:
          path: ${{ runner.temp }}/uke-stable-super-fastboot/fedora-*-fastboot.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Verify the downloadable bytes match the fastboot ZIP
        env:
          ARTIFACT_DIGEST: ${{ steps.download.outputs.artifact-digest }}
        run: |
          cd "$RUNNER_TEMP/uke-stable-super-fastboot"
          expected=$(awk '$2 ~ /^fedora-.*-fastboot[.]zip$/ {print $1}' SHA256SUMS)
          [[ $expected =~ ^[0-9a-f]{64}$ && $ARTIFACT_DIGEST == "$expected" ]]
          printf 'Fastboot ZIP SHA-256 `%s`.\n' "$expected" >> "$GITHUB_STEP_SUMMARY"
  stable-super-rescue:
    if: github.event_name == 'workflow_dispatch' && (inputs.stable_super_rescue || inputs.pad7_kernel_evr != '')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compose the signed boot profiles and live rescue seed
        env:
          IMAGE_EVR: ${{ inputs.stable_fastboot_kernel_evr }}
          PAD7_EVR: ${{ inputs.pad7_kernel_evr }}
          PAD7_RELEASE: ${{ inputs.pad7_kernel_release }}
          PAD7_SOURCE: ${{ inputs.pad7_kernel_source }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ $(uname -m) == aarch64 ]]
          channel=stable
          release=7.4.5-senemos
          source=717f7d6c8fd26d3c066f936101b8c2011391cbf2
          if [[ -n $PAD7_EVR ]]; then
            [[ $PAD7_EVR =~ ^7[.]3[.]5-[1-9][0-9]*[.]fc46$ && $PAD7_RELEASE =~ ^7[.]4[.][1-9][0-9]+-senemos$ && $PAD7_SOURCE =~ ^[0-9a-f]{40}$ ]]
            channel=unstable
            IMAGE_EVR=$PAD7_EVR
            release=$PAD7_RELEASE
            source=$PAD7_SOURCE
          else
            [[ $IMAGE_EVR == 7.3.5-13.fc46 ]]
          fi
          image=$(jq -er '.fedora_targets.rawhide.images.aarch64' configs/build-rules.json)
          [[ $image =~ ^registry[.]fedoraproject[.]org/fedora@sha256:[a-f0-9]{64}$ ]]
          job="$RUNNER_TEMP/uke-rescue-job"
          cache="$RUNNER_TEMP/uke-rescue-cache"
          mkdir -m700 "$job" "$cache"
          (( $(df -Pk "$job" | awk 'NR==2{print $4}') >= 24*1024*1024 ))
          jq -n --arg evr "$IMAGE_EVR" --arg source "$source" --arg release "$release" --arg channel "$channel" '
            {channel:$channel,fedora_release:"rawhide",kernel_profile:"normal",kernel_rpm_request:$evr,expected_kernel_release:$release,expected_kernel_source:$source}
          ' > "$job/request.json"
          docker run --rm --cpus=2 --memory=3g --pids-limit=512 \
            --cap-add=SYS_ADMIN --security-opt apparmor=unconfined \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/builder,readonly" \
            --mount "type=bind,source=$job,target=/job" \
            --mount "type=bind,source=$cache,target=/cache" \
            "$image" bash -Eeuo pipefail -c '
              dnf5 -y --setopt=install_weak_deps=False install jq gnupg2 curl cpio e2fsprogs util-linux coreutils findutils diffutils grep sed gawk binutils systemd systemd-libs libselinux libstdc++ kmod android-tools dnf5-plugins
              : > /.uke-rescue-worker
              bash /builder/src/image/compose-fedora-rescue.sh
              bash /builder/src/image/compose-fastboot-super-seed.sh /job/artifacts/rescue 4294967296 /job/artifacts/super-seed
              (cd /job/artifacts/super-seed; sha256sum -c --strict SHA256SUMS)
              (cd /job/artifacts/super-boots; sha256sum boot.img rescue-boot.img super-profiles.json > SHA256SUMS)
            '
          owner="$(id -u):$(id -g)"
          sudo chown "$owner" "$job/artifacts"
          sudo chown -R "$owner" "$job/artifacts/super-boots" "$job/artifacts/super-seed"
          printf 'Signed boot wrapper reproduction, FEDORA_RESCUE readback and the linux_swap/super seed verified.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uke-stable-super-components
          path: |
            ${{ runner.temp }}/uke-rescue-job/artifacts/super-boots
            ${{ runner.temp }}/uke-rescue-job/artifacts/super-seed
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
  pad7-desktop:
    if: github.event_name == 'workflow_dispatch' && inputs.pad7_kernel_evr != ''
    needs: source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Assemble the KDE desktop from signed RPMs
        env:
          IMAGE_EVR: ${{ inputs.pad7_kernel_evr }}
          IMAGE_RELEASE: ${{ inputs.pad7_kernel_release }}
          IMAGE_SOURCE: ${{ inputs.pad7_kernel_source }}
          UKE_CONTAINER_ENGINE: docker
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ $(uname -m) == aarch64 && $IMAGE_EVR =~ ^7[.]3[.]5-[1-9][0-9]*[.]fc46$ &&
             $IMAGE_RELEASE =~ ^7[.]4[.][1-9][0-9]+-senemos$ && $IMAGE_SOURCE =~ ^[0-9a-f]{40}$ ]]
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq zstd
          output="$RUNNER_TEMP/uke-pad7-desktop-build"
          bash scripts/build-image.sh --release rawhide --mode singleboot --filesystem ext4 \
            --desktop kde --shell bash --channel unstable --kernel-profile normal --kernel-rpm "$IMAGE_EVR" \
            --linux-size 8192 --jobs 2 --out "$output" --yes
          mapfile -t manifests < <(find "$output" -mindepth 3 -maxdepth 3 -path '*/artifacts/manifest.json')
          [[ ${#manifests[@]} == 1 ]]
          artifacts=${manifests[0]%/manifest.json}
          jq -e --arg release "$IMAGE_RELEASE" --arg source "$IMAGE_SOURCE" --arg evr "$IMAGE_EVR" '
            .kernel_release==$release and .kernel_source_commit==$source and (.rpm_version_release+.rpm_dist)==$evr
          ' "$artifacts/manifest.json" >/dev/null
          payload="$RUNNER_TEMP/uke-pad7-desktop"
          mkdir "$payload"
          mv "$artifacts/"{manifest.json,userdata.img,dtbo.img,dtbo-source-cohort.json} "$payload/"
          (cd "$payload"; sha256sum manifest.json userdata.img dtbo.img dtbo-source-cohort.json > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uke-pad7-desktop
          path: ${{ runner.temp }}/uke-pad7-desktop
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: pad7-desktop-diagnostics
          path: ${{ runner.temp }}/uke-pad7-desktop-build/image-*/*.log
          if-no-files-found: ignore
          retention-days: 7
  stable-fastboot:
    if: github.event_name == 'workflow_dispatch' && inputs.stable_fastboot_kernel_evr != '' && !inputs.stable_super_rescue
    needs: source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Assemble and verify the Stable fastboot ZIP
        env:
          IMAGE_EVR: ${{ inputs.stable_fastboot_kernel_evr }}
          UKE_CONTAINER_ENGINE: docker
          UKE_FASTBOOT_OUTPUT: '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ $(uname -m) == aarch64 && $IMAGE_EVR =~ ^7[.]3[.]5-[1-9][0-9]*[.]fc46$ ]]
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq zstd
          bash scripts/build-image.sh --release rawhide --mode singleboot --filesystem ext4 \
            --desktop kde --shell bash --channel stable --kernel-profile normal --kernel-rpm "$IMAGE_EVR" \
            --linux-size 8192 --jobs 2 --out "$RUNNER_TEMP/uke-stable-fastboot-build" --yes
          mapfile -t manifests < <(find "$RUNNER_TEMP/uke-stable-fastboot-build" -mindepth 3 -maxdepth 3 -path '*/fastboot/manifest.json')
          [[ ${#manifests[@]} == 1 ]]
          output=${manifests[0]%/manifest.json}
          (cd "$output"; sha256sum -c --strict SHA256SUMS)
          mv "$output" "$RUNNER_TEMP/uke-stable-fastboot"
          printf 'Stable KDE Plasma and Bash singleboot installation test for the measured 512 GB Uke. Includes DTBO, boot and userdata. The archive replaces userdata.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uke-stable-kde-bash-singleboot-fastboot
          path: ${{ runner.temp }}/uke-stable-fastboot
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: stable-fastboot-diagnostics
          path: ${{ runner.temp }}/uke-stable-fastboot-build/image-*/*.log
          if-no-files-found: ignore
          retention-days: 7
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install source inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck jq ripgrep make zstd zip unzip e2fsprogs socat
      - name: Validate source without compilation or RPM generation
        shell: bash
        run: |
          set -Eeuo pipefail
          guard=$(mktemp -d)
          trap 'rm -rf -- "$guard"' EXIT
          cat > "$guard/refuse-build" <<'GUARD'
          #!/bin/sh
          echo "Native compilation and RPM generation belong in COPR: ${0##*/}" >&2
          exit 97
          GUARD
          chmod +x "$guard/refuse-build"
          for tool in gcc g++ cc c++ clang clang++ as ld rpmbuild; do ln -s refuse-build "$guard/$tool"; done
          export PATH="$guard:$PATH"
          for script in src/public/*.sh packaging/*.sh; do bash -n "$script"; done
          shellcheck --exclude=SC2015 src/public/*.sh packaging/*.sh tests/public-build-contract.sh tests/public-channel-contract.sh
          bash tests/public-build-contract.sh
          shellcheck tests/distribution-routing.sh
          bash tests/distribution-routing.sh
          shellcheck src/ubuntu/configure-root.sh tests/ubuntu-root-contract.sh
          bash tests/ubuntu-root-contract.sh
          bash tests/public-channel-contract.sh
          shellcheck src/public/languages.sh tests/languages.sh
          bash tests/languages.sh
          shellcheck tests/language-repair.sh
          bash tests/language-repair.sh
          shellcheck tests/serialized-languages.sh
          bash tests/serialized-languages.sh
          shellcheck src/public/first-boot-policy.sh tests/first-boot-policy.sh tests/clock-epoch.sh
          bash tests/first-boot-policy.sh
          bash tests/clock-epoch.sh
          bash tests/repository-kernel-plan.sh
          shellcheck src/public/cohort.sh tests/repository-kernel-identity.sh
          shellcheck src/image/fastboot-requirements.sh src/image/package-stable-fastboot-test.sh
          shellcheck src/image/package-stable-super-fastboot.sh src/image/compose-super-empty.sh tests/stable-super-fastboot-update.sh tests/fastboot-tcp-peer.sh
          shellcheck src/image/compose-pad7-temporary-boot.sh src/image/compose-pad7-unstable-boot.sh tests/temporary-fastboot-boot.sh
          tools="$RUNNER_TEMP/stock-fastboot"
          mkdir "$tools"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --max-filesize 16777216 \
            https://dl.google.com/android/repository/platform-tools_r37.0.1-linux.zip -o "$tools/platform-tools.zip"
          (cd "$tools"; echo 'd230f13842f60f782a8645f9c813f8f845bf36089ea7289f28c48f17979313f1  platform-tools.zip' | sha256sum -c --strict)
          unzip -j "$tools/platform-tools.zip" platform-tools/fastboot -d "$tools"
          "$tools/fastboot" --version
          PATH="$tools:$PATH" bash tests/stable-super-fastboot-update.sh
          bash tests/repository-kernel-identity.sh
          bash tests/public-worker-snapshot.sh docker
          shellcheck --exclude=SC2015 src/audit/check-target-payload.sh tests/payload-traversal.sh
          bash tests/payload-traversal.sh
          shellcheck src/public/cutefish-icons-proof.sh tests/cutefish-passive-icons.sh
          bash tests/cutefish-passive-icons.sh
          bash tests/original-kde-payload.sh
          shellcheck src/public/release-layout.sh scripts/publish-image-release.sh scripts/merge-desktop-deliveries.sh scripts/reuse-validated-desktop.sh tests/release-layout.sh
          bash tests/release-layout.sh
          shellcheck src/public/shared-core.sh src/public/desktop-repository.sh src/public/desktop-setup.sh src/public/nextkde-session.sh scripts/hosted-core.sh scripts/hosted-image.sh tests/shared-core.sh
          bash tests/shared-core.sh
          shellcheck src/public/root-kernel-signatures.sh tests/root-kernel-signatures.sh
          bash tests/root-kernel-signatures.sh
          shellcheck scripts/reuse-verified-core.sh tests/reuse-core.sh
          bash tests/reuse-core.sh
          shellcheck src/public/desktop-isolation.sh tests/desktop-isolation.sh
          bash tests/desktop-isolation.sh
