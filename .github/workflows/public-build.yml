name: Public image build (manual)
on:
  workflow_dispatch:
    inputs:
      workspace_commit:
        description: Full 40-character uke-linux commit to build, including its recorded component pins
        required: true
        type: string
      kernel_version:
        description: Explicit Linux version supported by the selected kernel source (no latest alias)
        required: true
        type: string
      mode:
        type: choice
        options: [multiboot, singleboot]
        default: multiboot
      filesystem:
        type: choice
        options: [ext4, f2fs, btrfs, xfs]
        default: ext4
      desktop:
        type: choice
        options: [kde, gnome]
        default: kde
      channel:
        type: choice
        options: [stable, testing, unstable]
        default: testing
permissions:
  contents: read
jobs:
  compose:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build from the public workspace without device inputs
        env:
          WORKSPACE_COMMIT: ${{ inputs.workspace_commit }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          MODE: ${{ inputs.mode }}
          FILESYSTEM: ${{ inputs.filesystem }}
          DESKTOP: ${{ inputs.desktop }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -Eeuo pipefail
          [[ $KERNEL_VERSION =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo 'An explicit Linux version is required' >&2; exit 1; }
          job=$(mktemp -d)
          source src/public/workspace-source.sh
          checkout_release_workspace https://github.com/MCC45TR/uke-linux.git "$WORKSPACE_COMMIT" "$job/source"
          admit_release_builder "$job/source"
          # Keep a source receipt even if the subsequent build fails.
          {
            printf 'orchestrator %s\naggregate %s\nkernel_version %s\n' "$GITHUB_SHA" "$WORKSPACE_COMMIT" "$KERNEL_VERSION"
            git -C "$job/source" submodule status --recursive
          } | tee "$job/source-identity.txt"
          export UKE_KERNEL_REPO="$job/source/senemos-uke-kernel"
          "$job/source/ukelinux.sh" --build image --mode "$MODE" --filesystem "$FILESYSTEM" \
            --desktop "$DESKTOP" --channel "$CHANNEL" --kernel "$KERNEL_VERSION" --out "$job/out" --yes
          # Results remain local; this job does not publish firmware or device data.
          find "$job/out" -path '*/artifacts/manifest.json' -exec cat {} \;
