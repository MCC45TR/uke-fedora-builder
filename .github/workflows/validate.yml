name: Validate Fedora image recipes
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-transactions:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora@sha256:f7d3478d02965da40131211c19fb827b4d6e3de0904e9d582a9354af47949c14
    steps:
      - name: Install disposable RPM fixture tools
        run: dnf5 -y --setopt=install_weak_deps=False install git-core rpm-build rpm-sign dnf5-plugins gnupg2 createrepo_c jq diffutils findutils
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify stored package transactions
        run: bash tests/public-package-replay.sh
  host-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install host verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck jq ripgrep device-tree-compiler g++ libext2fs-dev libselinux1-dev libssl-dev libzstd-dev f2fs-tools e2fsprogs xfsprogs btrfs-progs zstd
      - name: Validate scripts and admission contracts
        run: |
          # SC2015 in older ShellCheck flags the intentional UUID-and-type
          # condition followed by explicit rejection if either check fails.
          # The pinned host validation also checks all default diagnostics.
          shellcheck --exclude=SC2015 src/public/*.sh src/image/*.sh src/boot/*.sh src/boot-pair/*.sh src/boot-pair/dracut/*.sh src/audit/*.sh tests/*.sh
          bash tests/public-build-contract.sh
          bash tests/public-worker-snapshot.sh docker
          sudo bash tests/public-worker-namespace.sh
          bash tests/image-contract.sh
          bash tests/boot-contract.sh
          bash tests/boot-pair-contract.sh
          bash tests/boot-pair-serial-contract.sh
          bash tests/initramfs-module-tuple.sh
          bash tests/kernel-config-contract.sh
          bash tests/kernel-export-contract.sh
          bash tests/original-kde-payload.sh
          bash tests/kernel-dt-admission.sh
          g++ -std=c++20 -O2 -Wall -Wextra -Werror src/image/ext4-labels.cpp -o /tmp/ext4-labels -lext2fs -lcom_err -lselinux
          g++ -std=c++20 -O2 -Wall -Wextra -Werror src/boot/boot-image.cpp -o /tmp/boot-image
          bash tests/boot-image-contract.sh /tmp/boot-image
          g++ -std=c++20 -O2 -Wall -Wextra -Werror src/image/check-userdata-payload.cpp -o /tmp/check-userdata-payload -lcrypto -lzstd
          g++ -std=c++20 -O2 -Wall -Wextra -Werror src/image/audit-languages.cpp -o /tmp/audit-languages
          bash tests/userdata-payload-contract.sh /tmp/check-userdata-payload /tmp/boot-image
          bash tests/userdata-filesystem-payload.sh /tmp/check-userdata-payload /tmp/boot-image
          g++ -std=c++20 -O2 -Wall -Wextra -Werror src/boot-pair/android-sparse.cpp -o /tmp/android-sparse
          bash tests/android-sparse-contract.sh /tmp/android-sparse /tmp/android-sparse-fixtures
